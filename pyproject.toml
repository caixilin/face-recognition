[project]
name = "face-attribute-analysis"
version = "0.1.0"
description = "基于 PyTorch 的人脸属性分析项目（年龄、性别、表情、朝向等）"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "torch==1.11.0",
    "torchvision==0.12.0",
    "numpy>=1.21",
    "opencv-python>=4.5",
    "Pillow>=9.0",
    "facenet-pytorch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py37"
